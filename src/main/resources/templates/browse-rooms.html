<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Rooms</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Available Rooms</h2>
    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
  </div>

  <div class="row g-4" th:if="${rooms != null}">
    <div class="col-md-4" th:each="room : ${rooms}">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title" th:text="${room.name}">Room A</h5>
          <p class="card-text" th:text="${room.description}">Room description...</p>
          <p class="card-text fw-bold mt-auto">Price: $<span th:text="${room.price}">100</span></p>
          <a th:href="@{/book-room(roomId=${room.id})}" class="btn btn-primary mt-3">Book Now</a>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${rooms == null or #lists.isEmpty(rooms)}" class="alert alert-info text-center">
    No rooms available at the moment.
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
