<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Browse Rooms</title>
  <link rel="stylesheet" href="/css/browse-rooms.css">
</head>
<body>
<header class="main-header">
  <div class="container">
    <h1>Browse Hostel Rooms</h1>
    <nav class="main-nav">
      <a href="/">Home</a>
      <a href="/login">Login</a>
    </nav>
  </div>
</header>

<main class="container">
  <h2 class="section-title">Available Rooms</h2>
  <div id="room-list" class="room-grid">
    <!-- Dynamic room cards will be inserted here -->

    <!-- Placeholder cards (in case fetch fails or slow) -->
    <div class='card placeholder'>
      <img src='/images/twin-room2.jpeg' alt='Sample Room' class='room-img'/>
      <div class='card-body'>
        <h3>Single Room</h3>
        <p><strong>Gender:</strong> Female</p>
        <p><strong>Price:</strong> $250</p>
        <p><strong>Amenities:</strong> Wi-Fi, Study Desk</p>
        <a href='/book-room?roomId=1' class='btn'>Book Now</a>
      </div>
    </div>
    <div class='card placeholder'>
      <img src='/images/double1.jpeg' alt='Sample Room' class='room-img'/>
      <div class='card-body'>
        <h3>Double Room</h3>
        <p><strong>Gender:</strong> Male</p>
        <p><strong>Price:</strong> $400</p>
        <p><strong>Amenities:</strong> Balcony, Fan</p>
        <a href='/book-room?roomId=2' class='btn'>Book Now</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2025 Hostel Booking System. All rights reserved.</p>
</footer>

<script>
  fetch('/api/rooms/available')
          .then(res => {
                  if (!res.ok) throw new Error('Failed to load rooms');
                  return res.json();
          })
          .then(data => {
            if (!Array.isArray(data)) throw new Error("Invalid response format");

            const container = document.getElementById('room-list');
            container.innerHTML = ''; // Clear placeholder
            if (data.length === 0) {
              container.innerHTML = '<p class="no-rooms">No rooms available at the moment. Please check back later.</p>';
            } else {
              const images = [
                '/images/single1.jpeg',
                '/images/double2.jpeg',
                '/images/twin-room2.jpeg',
                '/images/double1.jpeg',
                      '/images/modern.jpeg',
                      '/images/modern.jpeg'
              ];

              data.forEach((room, i) => {
                const img = images[i % images.length];
                container.innerHTML += `
            <div class='card'>
              <img src='${img}' onerror="this.src='/images/double1.jpeg'" alt='Room Image' class='room-img'/>
              <div class='card-body'>
                <h3>${room.type}</h3>
                <p><strong>Gender:</strong> ${room.gender}</p>
                <p><strong>Price:</strong> $${room.price}</p>
                <p><strong>Amenities:</strong> ${room.amenities.join(', ')}</p>
                <p><strong>Status:</strong> ${room.available ? 'Available' : 'Unavailable'}</p>
                ${room.available ? `<a href="/book-room?roomId=${room.id}" class="btn">Book Now</a>` : ''}
              </div>
            </div>`;
              });
            }
          });
</script>
</body>
</html>
