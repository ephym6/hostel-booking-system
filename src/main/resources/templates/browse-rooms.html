<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Available Rooms</h2>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="room : ${rooms}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${room.name}">Room Name</h5>
                    <p class="card-text">Price: <span th:text="${room.price}">0</span> KES</p>
                    <p class="card-text">Capacity: <span th:text="${room.capacity}">0</span></p>
                    <p class="card-text">Description: <span th:text="${room.description}">-</span></p>
                    <a th:href="@{/book-room/{roomId}(roomId=${room.id})}" class="btn btn-primary">Book Room</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
