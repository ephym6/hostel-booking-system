<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Room</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="text-center mb-4">Book a Room</h3>

          <form th:action="@{/book-room}" method="post" th:object="${booking}">
            <div class="mb-3">
              <label for="roomId" class="form-label">Room</label>
              <select class="form-select" id="roomId" th:field="*{roomId}" required>
                <option value="" disabled selected>Select a room</option>
                <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}">Room A</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="checkIn" class="form-label">Check-in Date</label>
              <input type="date" class="form-control" id="checkIn" th:field="*{checkInDate}" required>
            </div>

            <div class="mb-3">
              <label for="checkOut" class="form-label">Check-out Date</label>
              <input type="date" class="form-control" id="checkOut" th:field="*{checkOutDate}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Book Now</button>
          </form>

          <div class="mt-3 text-center">
            <a th:href="@{/browse-rooms}">← Browse Other Rooms</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
