<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Room</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="text-center mb-4">Book a Room</h3>

<form th:action="@{/students/book/{studentId}/{roomId}(studentId=${student.id}, roomId=${room.id})}" method="post">
  <div class="mb-3">
    <label for="roomId" class="form-label">Room ID</label>
    <input type="text" class="form-control" id="roomId" name="roomId" th:value="${room.id}" readonly>
  </div>
  
  <div class="mb-3">
    <label for="studentId" class="form-label">Your Student ID</label>
    <input type="text" class="form-control" id="studentId" name="studentId" th:value="${student.id}" readonly>
  </div>

  <button type="submit" class="btn btn-primary">Book Now</button>
</form>


          <div class="mt-3 text-center">
            <a th:href="@{/browse-rooms}">← Browse Other Rooms</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
