<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Room</title>
  <link rel="stylesheet" href="/css/book-room.css">
</head>
<body>
<header class="main-header">
  <h1>Book a Hostel Room</h1>
  <nav class="main-nav">
    <a href="/">Home</a>
    <a href="/browse-rooms">Browse Rooms</a>
    <a href="/login">Logout</a>
  </nav>
</header>

<main>
  <!-- Show error if any -->
  <div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
  </div>
  <div class="form-container">
    <form th:action="@{/book-room}" method="POST">
      <h2>Reservation Form</h2>
      <label for="roomId">Room ID</label>
      <input type="hidden" id="roomId" name="roomId" th:value="${roomId}">

      <button type="submit" class="btn">Confirm Booking</button>
    </form>
  </div>
</main>

<footer>
  <p>&copy; 2025 Hostel Booking System. All rights reserved.</p>
</footer>
</body>
</html>
