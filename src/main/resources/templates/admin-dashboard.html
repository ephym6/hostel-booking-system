<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center mb-4">User Dashboard</h2>

  <div class="mb-3 text-end">
    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3" th:text="'Welcome, ' + ${user.name} + '!'">Welcome, User!</h4>

      <a th:href="@{/book}" class="btn btn-primary mb-4">Book a Room</a>

      <h5>Your Bookings:</h5>
      <div class="table-responsive">
        <table class="table table-bordered table-hover mt-3">
          <thead class="table-light">
            <tr>
              <th>Room Number</th>
              <th>Check-in</th>
              <th>Check-out</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="booking : ${bookings}">
              <td th:text="${booking.roomNumber}">101</td>
              <td th:text="${booking.checkInDate}">2025-07-01</td>
              <td th:text="${booking.checkOutDate}">2025-07-03</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
