<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>
<header class="main-header">
    <h1>Admin Dashboard</h1>
    <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/login">Logout</a>
    </nav>
</header>

<main>
    <h2 class="section-title">Booking Requests</h2>
    <div id="booking-list" class="card-container"></div>
</main>

<footer>
    <p>&copy; 2025 Hostel Booking System. Admin Portal</p>
</footer>

<script>
    fetch('/admin/bookings')
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('booking-list');
            data.forEach(booking => {
                list.innerHTML += `
          <div class='card'>
            <p><strong>Booking ID:</strong> ${booking.id}</p>
            <p><strong>Student:</strong> ${booking.student.name}</p>
            <p><strong>Status:</strong> ${booking.status}</p>
            <div class="btn-group">
              <button onclick="approve(${booking.id})">Approve</button>
              <button onclick="reject(${booking.id})">Reject</button>
            </div>
          </div>`;
            });
        });

    function approve(bookingId) {
        fetch(`/admin/approve/${bookingId}`, { method: 'POST' })
            .then(() => location.reload());
    }
    function reject(bookingId) {
        fetch(`/admin/reject/${bookingId}`, { method: 'POST' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
