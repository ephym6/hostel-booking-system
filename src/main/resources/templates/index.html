<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostel Booking System</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="p-5 bg-white shadow rounded">
        <h1 class="mb-4">Welcome to the Hostel Booking System</h1>
        <div class="d-grid gap-3 col-6 mx-auto">
          <a th:href="@{/login}" class="btn btn-primary btn-lg">Login</a>
          <a th:href="@{/register}" class="btn btn-outline-secondary btn-lg">Register</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
